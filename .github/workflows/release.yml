name: Publish versioned TidaLuna plugin release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Luna store package
        uses: actions/download-artifact@v4
        with:
          name: omniphony-luna-release
          path: ./release

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Omniphony EX ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: ./release/*
