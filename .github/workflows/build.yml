name: Build and verify TidaLuna plugin store package

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.13.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Run plugin lifecycle tests
        run: node --test tests/*.test.mjs

      - name: Build plugin modules and store catalog
        run: pnpm run build

      - name: Run playback controls and priority UI harness
        run: node test_priority_ui.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Test loopback TidaLuna dev store
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Test GitHub release asset naming
        run: python -m unittest tools.test_prepare_release

      - name: Run Eclipse account-auth regression tests
        shell: pwsh
        run: |
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_eclipse_auth_status.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test runtime digest contracts
        run: python -m unittest discover -s tests -p "test_runtime_package_verifier.py"

      - name: Run embedded API and downloader tests
        shell: pwsh
        run: |
          Push-Location api
          try {
            python -m unittest test_check_service_health test_downloader test_package_runtime test_playback_transport test_service_lifecycle
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Build and verify the bundled API runtime
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'dist/OmniphonyEX-API-win-x64.tar.gz'
          & 'api/runtime/python.exe' tools/package-runtime.py --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $module = Join-Path $PWD 'dist/Omniphony EX Audio Engine.mjs'
          $moduleText = Get-Content -LiteralPath $module -Raw
          $pin = [regex]::Match($moduleText, 'const bundleSha256 = "([A-Fa-f0-9]{64})";')
          if (-not $pin.Success) { throw 'Built plugin module has no valid runtime bundle SHA-256 pin.' }
          $expectedSha256 = $pin.Groups[1].Value
          python tools/verify-runtime-package.py --archive $archive --plugin-module $module --expected-sha256 $expectedSha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify-luna-store.py --dist dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare official release filenames
        shell: pwsh
        run: |
          $release = Join-Path $PWD 'dist/release'
          python tools/prepare_release.py --dist dist --output $release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify-luna-store.py --dist $release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: omniphony-luna-release
          path: dist/release/*
          if-no-files-found: error
